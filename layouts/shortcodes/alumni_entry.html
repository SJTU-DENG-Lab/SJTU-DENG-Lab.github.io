{{- $homepage := .Get "homepage" | default "" | strings.TrimSpace -}}
{{- $description := .Get "description" | default "" | strings.TrimSpace -}}
<li class="alumni-entry">
  <strong class="alumni-name">
    {{- if and $homepage (ne $homepage "#") -}}
      <a href="{{ $homepage }}" target="_blank" rel="noopener noreferrer">{{ .Get "name" }}</a>
    {{- else -}}
      {{ .Get "name" }}
    {{- end -}}
  </strong> – {{ $description }}
</li>
