<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}" dir="{{ .Language.LanguageDirection | default "auto" }}">
<head>
  {{- partial "head.html" . }}
  {{- if .Param "math" }}{{ partialCached "math.html" . }}{{ end }}
</head>
<body class="lab-site{{ if .IsHome }} page-home{{ end }}{{ if eq site.Params.defaultTheme `dark` }} dark{{ end }}" id="top">
  {{- partial "header.html" . }}
  <main class="main" id="main-content" tabindex="-1">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
</body>
</html>
