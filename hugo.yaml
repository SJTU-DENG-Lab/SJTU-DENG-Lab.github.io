baseURL: 'https://SJTU-DENG-Lab.github.io/'
languageCode: en-us
title: 'DENG Lab @ SJTU'
theme: 'PaperMod'

googleAnalytics: 'G-T4DXGLCH1D'


# Setup build timeout of hugo (in seconds)
# FIXME: This is a workaround for rendering differnet sizes of the gif images.
timeout: 90 # seconds


markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - $
            - $
        enable: true
params:
  env: production
  # Keep RSS metadata compatible with Hugo >= 0.158, where site.Author was removed.
  author: 'DENG Lab @ SJTU'
  description: 'Efficient generative AI across language, vision, and action at Shanghai Jiao Tong University.'
  images: ['/img/lab/team-1280.webp']
  math: true
  label:
    icon: "/img/lab/logo.svg"
  assets:
    favicon: '/favicon.svg'
    css:
      - "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  # Define social params to avoid deprecated .Site.Social usage in Hugo >= 0.124
  social:
    twitter: sjtudenglab      # Without '@'
    facebook_admin: ""        # Optional, leave empty if not used
  # Optional: show social icons on home/profile if enabled by theme
  socialIcons:
    - name: github
      url: "https://github.com/SJTU-DENG-Lab"
    - name: x
      url: "https://x.com/sjtudenglab"
    - name: zhihu
      url: "https://www.zhihu.com/people/SJTUDengLab"
  
menu:
  main:
    - identifier: Home
      name: Home
      url: /
      weight: 10
    - identifier: Blogs
      name: Blogs
      url: /blogs/
      weight: 40
    - identifier: Team
      name: Team
      url: /people/
      weight: 30
    - identifier: Gallery
      name: Gallery
      url: /gallery/
      weight: 35
    - identifier: Publications
      name: Publications
      url: /publications/
      weight: 20
    - identifier: Contact
      name: Join Us
      url: /contact/
      weight: 60
    
